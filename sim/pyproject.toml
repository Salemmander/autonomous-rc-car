[project]
name = "sim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "evdev>=2.0.0",
  "mujoco>=3.16.0",
  "mujoco-warp>=3.16.0",
  "numpy>=2.4.6",
  "pillow>=13.0.0",
  "tensorboard>=2.21.0",
  "torch>=2.10.0",
  "warp-lang>=1.18.0",
]

# Installs rcsim/ into the venv (editable), so scripts anywhere (tools/) can import it
[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rcsim"
module-root = ""
